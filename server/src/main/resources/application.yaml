ktor:
  deployment:
    port: "$PORT:8080"
  application:
    modules:
      - com.kotlincalendar.server.ApplicationKt.module

grpc:
  port: "$GRPC_PORT:50051"

cors:
  # 쉼표로 구분한 host:port 목록 (webApp 개발 서버 포함)
  hosts: "$CORS_HOSTS:localhost:8081,localhost:8080"

database:
  # supabase | mysql | h2  (server-database 스킬)
  provider: "$DB_PROVIDER:supabase"
  supabase:
    # Supabase 대시보드 > Connect > Session pooler 의 JDBC URL
    # 예: jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres
    url: "$SUPABASE_DB_URL:"
    user: "$SUPABASE_DB_USER:"
    password: "$SUPABASE_DB_PASSWORD:"
    maxPoolSize: "$SUPABASE_DB_POOL_SIZE:5"
  mysql:
    url: "$MYSQL_URL:jdbc:mysql://localhost:3306/calendar"
    user: "$MYSQL_USER:root"
    password: "$MYSQL_PASSWORD:"
    maxPoolSize: "$MYSQL_POOL_SIZE:10"
  h2:
    url: "$H2_URL:jdbc:h2:mem:calendar;DB_CLOSE_DELAY=-1"
