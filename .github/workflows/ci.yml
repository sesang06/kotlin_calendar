name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ktlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ktlintCheck --continue

  server-test:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # 테스트는 H2 + MockK만 사용한다. Supabase 접속 정보가 필요 없다.
      - run: ./gradlew :server:test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-reports
          path: server/build/reports/tests

  migration-test:
    name: DB migrations (PostgreSQL / MySQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: calendar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: calendar
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysql"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # 일회용 CI 컨테이너 전용 접속 정보 (비밀값 아님).
      MIGRATION_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/calendar?user=postgres&password=postgres
      MIGRATION_TEST_MYSQL_URL: jdbc:mysql://localhost:3306/calendar?user=root&password=mysql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :server:test --tests "*MigrationIntegrationTest"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: migration-test-reports
          path: server/build/reports/tests

  client-test:
    name: Client tests (JVM / Android / Wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: >
          ./gradlew
          :client:shared:desktopTest
          :client:shared:testDebugUnitTest
          :client:shared:wasmJsNodeTest
          :client:desktopApp:compileKotlin
          :client:androidApp:assembleDebug
          :client:webApp:wasmJsBrowserDistribution
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-reports
          path: client/shared/build/reports/tests

  client-ios-test:
    name: Client tests (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :client:shared:iosSimulatorArm64Test
