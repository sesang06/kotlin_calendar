name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ktlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ktlintCheck --continue

  server-test:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # 테스트는 H2 + MockK만 사용한다. Supabase 접속 정보가 필요 없다.
      - run: ./gradlew :server:test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-reports
          path: server/build/reports/tests

  client-test:
    name: Client tests (JVM / Android / Wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: >
          ./gradlew
          :client:shared:desktopTest
          :client:shared:testDebugUnitTest
          :client:shared:wasmJsNodeTest
          :client:desktopApp:compileKotlin
          :client:androidApp:assembleDebug
          :client:webApp:wasmJsBrowserDistribution
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-reports
          path: client/shared/build/reports/tests

  client-ios-test:
    name: Client tests (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :client:shared:iosSimulatorArm64Test
